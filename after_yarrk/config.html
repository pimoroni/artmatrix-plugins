<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Ship size</legend>
    <small>Size of the ships and waves</small>
    <div class="presets">
      <label><input type="radio" name="global_scale" value="0.15" {{ "checked" if placeholder.global_scale == 0.15 else "" }}>Small</label>
      <label><input type="radio" name="global_scale" value="0.2" {{ "checked" if placeholder.global_scale == 0.2 else "" }}>Medium</label>
      <label><input type="radio" name="global_scale" value="0.3" {{ "checked" if placeholder.global_scale == 0.3 else "" }}>Large</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Number of ships</legend>
    <div class="presets">
      <label><input type="radio" name="num_ships" value="3" {{ "checked" if placeholder.num_ships == 3 else "" }}>Quiet</label>
      <label><input type="radio" name="num_ships" value="5" {{ "checked" if placeholder.num_ships == 5 else "" }}>Busy</label>
      <label><input type="radio" name="num_ships" value="7" {{ "checked" if placeholder.num_ships == 7 else "" }}>Crowded</label>
      <label><input type="radio" name="num_ships" value="10" {{ "checked" if placeholder.num_ships == 10 else "" }}>Evergiven</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Travel speed</legend>
    <div class="presets">
      <label><input type="radio" name="travel_speed" value="0.25" {{ "checked" if placeholder.travel_speed == 0.25 else "" }}>Slow</label>
      <label><input type="radio" name="travel_speed" value="0.5" {{ "checked" if placeholder.travel_speed == 0.5 else "" }}>Medium</label>
      <label><input type="radio" name="travel_speed" value="1.0" {{ "checked" if placeholder.travel_speed == 1.0 else "" }}>Fast</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
