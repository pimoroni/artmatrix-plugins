<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Trilobites</legend>
    <small>Each one comes with an ammonite to eat</small>
    <div class="presets">
      <label><input type="radio" name="num_trilobites" value="1" {{ "checked" if placeholder.num_trilobites == 1 else "" }}>1</label>
      <label><input type="radio" name="num_trilobites" value="2" {{ "checked" if placeholder.num_trilobites == 2 else "" }}>2</label>
      <label><input type="radio" name="num_trilobites" value="5" {{ "checked" if placeholder.num_trilobites == 5 else "" }}>5</label>
      <label><input type="radio" name="num_trilobites" value="10" {{ "checked" if placeholder.num_trilobites == 10 else "" }}>10</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Speed</legend>
    <div class="presets">
      <label><input type="radio" name="trilobite_speed" value="0.1" {{ "checked" if placeholder.trilobite_speed == 0.1 else "" }}>Slow</label>
      <label><input type="radio" name="trilobite_speed" value="0.2" {{ "checked" if placeholder.trilobite_speed == 0.2 else "" }}>Medium</label>
      <label><input type="radio" name="trilobite_speed" value="0.4" {{ "checked" if placeholder.trilobite_speed == 0.4 else "" }}>Fast</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
