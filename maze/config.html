<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Scene</legend>
    <div class="presets">
      <label><input type="radio" name="preset" value="random" {{ "checked" if placeholder.preset == "random" else "" }}>Random</label>
      <label><input type="radio" name="preset" value="lv426" {{ "checked" if placeholder.preset == "lv426" else "" }}>LV-426</label>
      <label><input type="radio" name="preset" value="lost_empire" {{ "checked" if placeholder.preset == "lost_empire" else "" }}>Lost Empire</label>
      <label><input type="radio" name="preset" value="neon" {{ "checked" if placeholder.preset == "neon" else "" }}>Neon</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Change scene every (minutes)</legend>
    <small>Only when the scene is Random</small>
    <div class="presets">
      <label><input type="radio" name="maze_period" value="0" {{ "checked" if placeholder.maze_period == 0 else "" }}>Never</label>
      <label><input type="radio" name="maze_period" value="5" {{ "checked" if placeholder.maze_period == 5 else "" }}>5</label>
      <label><input type="radio" name="maze_period" value="10" {{ "checked" if placeholder.maze_period == 10 else "" }}>10</label>
      <label><input type="radio" name="maze_period" value="15" {{ "checked" if placeholder.maze_period == 15 else "" }}>15</label>
      <label><input type="radio" name="maze_period" value="30" {{ "checked" if placeholder.maze_period == 30 else "" }}>30</label>
      <label><input type="radio" name="maze_period" value="60" {{ "checked" if placeholder.maze_period == 60 else "" }}>60</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
