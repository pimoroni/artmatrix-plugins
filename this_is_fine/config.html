<form method="post" action="/config?plugin={{ plugin }}">
  <label>Message
    <small>The text to display</small>
    <input type="text" name="message" value="{{ placeholder.message }}">
  </label>

  <label>Pixel size
    <small>Resolution of the fire in pixels (max 3)</small>
    <input type="number" name="pixel_size" min="1" max="3" step="1" value="{{ placeholder.pixel_size }}">
  </label>

  <label>Scroll text
    <input type="checkbox" name="scroll" {{ "checked" if placeholder.scroll else "" }}>
  </label>

  <button type="submit">Apply</button>
</form>
