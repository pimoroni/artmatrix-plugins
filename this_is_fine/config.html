<form method="post" action="/config?plugin={{ plugin }}">
  <label>Message
    <small>The text to display</small>
    <input type="text" name="message" value="{{ placeholder.message }}">
  </label>

  <fieldset>
    <legend>Fire detail</legend>
    <div class="presets">
      <label><input type="radio" name="pixel_size" value="3" {{ "checked" if placeholder.pixel_size == 3 else "" }}>Low</label>
      <label><input type="radio" name="pixel_size" value="2" {{ "checked" if placeholder.pixel_size == 2 else "" }}>Medium</label>
      <label><input type="radio" name="pixel_size" value="1" {{ "checked" if placeholder.pixel_size == 1 else "" }}>High</label>
    </div>
  </fieldset>

  <label>Scroll text
    <input type="checkbox" name="scroll" {{ "checked" if placeholder.scroll else "" }}>
  </label>

  <button type="submit">Apply</button>
</form>
