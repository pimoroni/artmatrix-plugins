<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map .leaflet-bar {
    border-radius: 4px;
    overflow: hidden;
  }
  #map .leaflet-control-zoom a {
    box-sizing: content-box;
    width: 26px;
    height: 26px;
    line-height: 26px;
    padding: 0;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    border-radius: 0;
    display: block;
  }
  #map img {
    max-width: none;
    background: none;
    border: none;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
  }
</style>

<form method="post" action="/config?plugin={{ plugin }}">
  <label>Location
    <small>Click the map to set your position, or type coordinates below.</small>
    <div id="map" style="height: 300px; margin: 0.5em 0;"></div>
  </label>

  <label>Latitude
    <input type="number" name="lat" min="-90" max="90" step="any" value="{{ placeholder.lat }}">
  </label>

  <label>Longitude
    <input type="number" name="lng" min="-180" max="180" step="any" value="{{ placeholder.lng }}">
  </label>

  <button type="submit">Apply</button>
</form>

<script>
  const latInput = document.querySelector('[name=lat]');
  const lngInput = document.querySelector('[name=lng]');

  // Start on the saved location if present, otherwise a zoomed-out world view.
  const startLat = parseFloat(latInput.value);
  const startLng = parseFloat(lngInput.value);
  const hasStart = !isNaN(startLat) && !isNaN(startLng);

  const map = L.map('map').setView(
    hasStart ? [startLat, startLng] : [0, 0],
    hasStart ? 10 : 2
  );

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let marker = hasStart ? L.marker([startLat, startLng]).addTo(map) : null;

  map.on('click', function (e) {
    const p = e.latlng.wrap();
    latInput.value = p.lat.toFixed(6);
    lngInput.value = p.lng.toFixed(6);
    if (marker) {
      marker.setLatLng(p);
    } else {
      marker = L.marker(p).addTo(map);
    }
  });
</script>
