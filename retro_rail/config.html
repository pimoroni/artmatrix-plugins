<form method="post" action="/config?plugin={{ plugin }}" data-autosave>
  <label>Station code
    <small>The station's three letter code, like SHF for Sheffield or KGX for London Kings Cross</small>
    <input type="text" name="station" value="{{ placeholder.station }}" maxlength="3" autocapitalize="characters" autocomplete="off" spellcheck="false">
  </label>

  <label>Rail Data key
    <small>Free from the <a href="https://raildata.org.uk" target="_blank">Rail Data Marketplace</a>. Subscribe to "Live Arrival and Departure Boards" and paste the consumer key from its Specification tab here. Without one, sample Sheffield times are shown</small>
    <input type="text" name="token" value="{{ placeholder.token }}" autocomplete="off" spellcheck="false">
  </label>

  <fieldset>
    <legend>Show</legend>
    <div class="presets">
      <label><input type="radio" name="board" value="departures" {{ "checked" if placeholder.board == "departures" else "" }}>Departures</label>
      <label><input type="radio" name="board" value="arrivals" {{ "checked" if placeholder.board == "arrivals" else "" }}>Arrivals</label>
      <label><input type="radio" name="board" value="both" {{ "checked" if placeholder.board == "both" else "" }}>Both</label>
    </div>
  </fieldset>
</form>
