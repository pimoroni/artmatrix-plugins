<form method="post" action="/config?plugin={{ plugin }}">
  <label>Max interval
    <small>Maximum time between changes of look direction / expression (seconds)</small>
    <input type="number" name="max_interval" min="1" step="1" value="{{ placeholder.max_interval }}">
  </label>

  <label>Max duration
    <small>Maximum time to hold Pearl's expression (seconds)</small>
    <input type="number" name="max_duration" min="1" step="1" value="{{ placeholder.max_duration }}">
  </label>

  <label>Starting piece
    <small>Which artwork to start on</small>
    <select name="piece">
      <option value="0" {{ "selected" if placeholder.piece == 0 else "" }}>Lisa</option>
      <option value="1" {{ "selected" if placeholder.piece == 1 else "" }}>Scream</option>
      <option value="2" {{ "selected" if placeholder.piece == 2 else "" }}>Pearl</option>
    </select>
  </label>

  <label>Art lifetime
    <small>Minutes between cycling art</small>
    <input type="number" name="art_lifetime" min="1" step="1" value="{{ placeholder.art_lifetime }}">
  </label>

<label>Cycle through all pieces
    <input type="checkbox" name="cycle" {{ "checked" if placeholder.cycle else "" }}>
  </label>

  <button type="submit">Apply</button>
</form>
