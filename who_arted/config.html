<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Artwork</legend>
    <div class="presets">
      <label><input type="radio" name="artwork" value="0" {{ "checked" if placeholder.artwork == "0" else "" }}>Lisa</label>
      <label><input type="radio" name="artwork" value="1" {{ "checked" if placeholder.artwork == "1" else "" }}>Scream</label>
      <label><input type="radio" name="artwork" value="2" {{ "checked" if placeholder.artwork == "2" else "" }}>Pearl</label>
      <label><input type="radio" name="artwork" value="cycle" {{ "checked" if placeholder.artwork == "cycle" else "" }}>All in turn</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Change artwork every</legend>
    <small>When showing all in turn</small>
    <div class="presets">
      <label><input type="radio" name="art_lifetime" value="10" {{ "checked" if placeholder.art_lifetime == 10 else "" }}>10 min</label>
      <label><input type="radio" name="art_lifetime" value="30" {{ "checked" if placeholder.art_lifetime == 30 else "" }}>30 min</label>
      <label><input type="radio" name="art_lifetime" value="60" {{ "checked" if placeholder.art_lifetime == 60 else "" }}>1 hour</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
