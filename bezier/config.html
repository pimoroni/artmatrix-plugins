<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Curves</legend>
    <div class="presets">
      <label><input type="radio" name="curves" value="1" {{ "checked" if placeholder.curves == 1 else "" }}>1</label>
      <label><input type="radio" name="curves" value="2" {{ "checked" if placeholder.curves == 2 else "" }}>2</label>
      <label><input type="radio" name="curves" value="3" {{ "checked" if placeholder.curves == 3 else "" }}>3</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Points per curve</legend>
    <small>More points make more complex shapes</small>
    <div class="presets">
      <label><input type="radio" name="points" value="3" {{ "checked" if placeholder.points == 3 else "" }}>3</label>
      <label><input type="radio" name="points" value="5" {{ "checked" if placeholder.points == 5 else "" }}>5</label>
      <label><input type="radio" name="points" value="7" {{ "checked" if placeholder.points == 7 else "" }}>7</label>
      <label><input type="radio" name="points" value="10" {{ "checked" if placeholder.points == 10 else "" }}>10</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Trail</legend>
    <div class="presets">
      <label><input type="radio" name="trail_length" value="0" {{ "checked" if placeholder.trail_length == 0 else "" }}>None</label>
      <label><input type="radio" name="trail_length" value="1" {{ "checked" if placeholder.trail_length == 1 else "" }}>Short</label>
      <label><input type="radio" name="trail_length" value="3" {{ "checked" if placeholder.trail_length == 3 else "" }}>Medium</label>
      <label><input type="radio" name="trail_length" value="4" {{ "checked" if placeholder.trail_length == 4 else "" }}>Long</label>
      <label><input type="radio" name="trail_length" value="5" {{ "checked" if placeholder.trail_length == 5 else "" }}>Forever</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Speed</legend>
    <div class="presets">
      <label><input type="radio" name="max_speed" value="0.5" {{ "checked" if placeholder.max_speed == 0.5 else "" }}>Slow</label>
      <label><input type="radio" name="max_speed" value="1.0" {{ "checked" if placeholder.max_speed == 1.0 else "" }}>Medium</label>
      <label><input type="radio" name="max_speed" value="2.0" {{ "checked" if placeholder.max_speed == 2.0 else "" }}>Fast</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Colour</legend>
    <div class="colour-row">
      <input type="color" name="colour" aria-label="Colour" value="{{ '#%02x%02x%02x' % placeholder.colour }}">
      <label><input type="checkbox" name="rainbow" {{ "checked" if placeholder.rainbow else "" }}>Rainbow</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
