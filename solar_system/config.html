<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Planets</legend>
    <div class="presets">
      <label><input type="radio" name="num_planets" value="3" {{ "checked" if placeholder.num_planets == 3 else "" }}>3</label>
      <label><input type="radio" name="num_planets" value="5" {{ "checked" if placeholder.num_planets == 5 else "" }}>5</label>
      <label><input type="radio" name="num_planets" value="7" {{ "checked" if placeholder.num_planets == 7 else "" }}>7</label>
      <label><input type="radio" name="num_planets" value="9" {{ "checked" if placeholder.num_planets == 9 else "" }}>9</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Planet size</legend>
    <div class="presets">
      <label><input type="radio" name="planet_size" value="small" {{ "checked" if placeholder.planet_size == "small" else "" }}>Small</label>
      <label><input type="radio" name="planet_size" value="mixed" {{ "checked" if placeholder.planet_size == "mixed" else "" }}>Mixed</label>
      <label><input type="radio" name="planet_size" value="large" {{ "checked" if placeholder.planet_size == "large" else "" }}>Large</label>
    </div>
  </fieldset>

  <label>Minutes per orbit
    <small>Fastest / slowest planet</small>
    <div class="field-row">
      <input type="number" name="min_mins_per_orbit" min="0.1" step="any" value="{{ placeholder.min_mins_per_orbit }}">
      <input type="number" name="max_mins_per_orbit" min="0" step="any" value="{{ placeholder.max_mins_per_orbit }}">
    </div>
  </label>

  <fieldset>
    <legend>Background</legend>
    <div class="presets">
      <label><input type="radio" name="background" value="0" {{ "checked" if placeholder.background == 0 else "" }}>Random</label>
      <label><input type="radio" name="background" value="1" {{ "checked" if placeholder.background == 1 else "" }}>1</label>
      <label><input type="radio" name="background" value="2" {{ "checked" if placeholder.background == 2 else "" }}>2</label>
      <label><input type="radio" name="background" value="3" {{ "checked" if placeholder.background == 3 else "" }}>3</label>
      <label><input type="radio" name="background" value="4" {{ "checked" if placeholder.background == 4 else "" }}>4</label>
      <label><input type="radio" name="background" value="5" {{ "checked" if placeholder.background == 5 else "" }}>5</label>
    </div>
  </fieldset>

  <label>Sun colour
    <small>Pick the sun's colour.</small>
    <input type="color" name="sun_colour"
           value="{{ '#%02x%02x%02x' % placeholder.sun_colour }}">
  </label>

  <button type="submit">Apply</button>
</form>
