<form method="post" action="/config?plugin={{ plugin }}">
  <label>Colours
    <small>Background / text</small>
    <div class="field-row">
      <input type="color" name="background" value="{{ '#%02x%02x%02x' % placeholder.background }}">
      <input type="color" name="terminal_text" value="{{ '#%02x%02x%02x' % placeholder.terminal_text }}">
    </div>
  </label>

  <fieldset>
    <legend>Speed</legend>
    <div class="presets">
      <label><input type="radio" name="terminal_speed" value="500" {{ "checked" if placeholder.terminal_speed == 500 else "" }}>Slow</label>
      <label><input type="radio" name="terminal_speed" value="250" {{ "checked" if placeholder.terminal_speed == 250 else "" }}>Medium</label>
      <label><input type="radio" name="terminal_speed" value="100" {{ "checked" if placeholder.terminal_speed == 100 else "" }}>Fast</label>
      <label><input type="radio" name="terminal_speed" value="30" {{ "checked" if placeholder.terminal_speed == 30 else "" }}>Very fast</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
