<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Block size</legend>
    <div class="presets">
      <label><input type="radio" name="size" value="1" {{ "checked" if placeholder.size == 1 else "" }}>1 px</label>
      <label><input type="radio" name="size" value="2" {{ "checked" if placeholder.size == 2 else "" }}>2 px</label>
      <label><input type="radio" name="size" value="4" {{ "checked" if placeholder.size == 4 else "" }}>4 px</label>
      <label><input type="radio" name="size" value="8" {{ "checked" if placeholder.size == 8 else "" }}>8 px</label>
      <label><input type="radio" name="size" value="16" {{ "checked" if placeholder.size == 16 else "" }}>16 px</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Flicker</legend>
    <div class="presets">
      <label><input type="radio" name="flicker" value="low" {{ "checked" if placeholder.flicker == "low" else "" }}>Low</label>
      <label><input type="radio" name="flicker" value="medium" {{ "checked" if placeholder.flicker == "medium" else "" }}>Medium</label>
      <label><input type="radio" name="flicker" value="high" {{ "checked" if placeholder.flicker == "high" else "" }}>High</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
