<form method="post" action="/config?plugin={{ plugin }}">
  <label>Grid
    <small>Grid resolution (max 128)</small>
    <input type="number" name="grid" min="1" max="128" step="1" value="{{ placeholder.grid }}">
  </label>

  <label>Block size
    <small>On-screen size of each pixel</small>
    <input type="number" name="size" min="1" step="1" value="{{ placeholder.size }}">
  </label>

  <label>Blocks per frame
    <small>How many pixels change each frame</small>
    <input type="number" name="blocks_per_frame" min="1" step="1" value="{{ placeholder.blocks_per_frame }}">
  </label>

  <button type="submit">Apply</button>
</form>
