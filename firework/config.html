<form method="post" action="/config?plugin={{ plugin }}">
  <label>Spark frequencies
    <small>Relative proportions of sparks with 0 / 1 / 2 generations of children</small>
    <div>
      <input type="number" name="freq_0" min="0" step="1" value="{{ placeholder.frequencies[0] }}">
      <input type="number" name="freq_1" min="0" step="1" value="{{ placeholder.frequencies[1] }}">
      <input type="number" name="freq_2" min="0" step="1" value="{{ placeholder.frequencies[2] }}">
    </div>
  </label>

  <label>Timing
    <small>Launch chance per frame: "1 in x".</small>
    <input type="number" name="timing" min="1" step="1" value="{{ placeholder.timing }}">
  </label>

  <label>Gravity
    <small>Gravity level (whole number)</small>
    <input type="number" name="gravity" min="0" step="1" value="{{ placeholder.gravity }}">
  </label>

  <label>Max speed
    <small>Maximum speed of the fireworks</small>
    <input type="number" name="max_speed" min="0" step="1" value="{{ placeholder.max_speed }}">
  </label>

  <label class="row">
    <input type="checkbox" name="show_fps" {{ "checked" if placeholder.show_fps else "" }}>
    Show FPS <small>Framerate in the top-left corner</small>
  </label>

  <button type="submit">Apply</button>
</form>
