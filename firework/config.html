<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Fireworks</legend>
    <small>How many go up</small>
    <div class="presets">
      <label><input type="radio" name="timing" value="100" {{ "checked" if placeholder.timing == 100 else "" }}>Low</label>
      <label><input type="radio" name="timing" value="60" {{ "checked" if placeholder.timing == 60 else "" }}>Medium</label>
      <label><input type="radio" name="timing" value="30" {{ "checked" if placeholder.timing == 30 else "" }}>High</label>
      <label><input type="radio" name="timing" value="15" {{ "checked" if placeholder.timing == 15 else "" }}>Very high</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Launch height</legend>
    <div class="presets">
      <label><input type="radio" name="max_speed" value="20" {{ "checked" if placeholder.max_speed == 20 else "" }}>Low</label>
      <label><input type="radio" name="max_speed" value="32" {{ "checked" if placeholder.max_speed == 32 else "" }}>Medium</label>
      <label><input type="radio" name="max_speed" value="48" {{ "checked" if placeholder.max_speed == 48 else "" }}>High</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
