<form method="post" action="/config?plugin={{ plugin }}" data-autosave>
  <fieldset>
    <legend>Colour scheme</legend>
    <div class="presets">
      <label><input type="radio" name="scheme" value="boreal" {{ "checked" if placeholder.scheme == "boreal" else "" }}>Boreal</label>
      <label><input type="radio" name="scheme" value="solar" {{ "checked" if placeholder.scheme == "solar" else "" }}>Solar</label>
      <label><input type="radio" name="scheme" value="glacier" {{ "checked" if placeholder.scheme == "glacier" else "" }}>Glacier</label>
    </div>
  </fieldset>
</form>
