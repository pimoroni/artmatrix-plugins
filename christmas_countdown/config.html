<aside>Nothing to set up, it counts the sleeps to Christmas by itself.
  <button type="button" class="candy-cane" aria-label="Let it snow">
    <svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true">
      <path d="M3 19V6a3.5 3.5 0 0 1 7 0v1.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M3 19V6a3.5 3.5 0 0 1 7 0v1.5" fill="none" stroke="#e0262c" stroke-width="3" stroke-dasharray="2.2 2.2"/>
    </svg>
  </button>
</aside>
<canvas class="page-snow" aria-hidden="true"></canvas>
<output class="ho-ho-ho" aria-live="polite"></output>

<style>
  .candy-cane {
    background: none;
    border: 0;
    padding: 4px;
    margin: -4px 0;
    vertical-align: middle;
    cursor: default;
  }
  .candy-cane.wiggle { animation: wiggle 0.5s ease-in-out; }
  @keyframes wiggle {
    25% { transform: rotate(-14deg); }
    75% { transform: rotate(14deg); }
  }
  .page-snow {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 10;
  }
  .ho-ho-ho {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    font-family: var(--font);
    font-size: clamp(2.5rem, 12vw, 5rem);
    font-weight: 800;
    color: #e0262c;
    text-shadow: 0 0 0.15em #fff, 0 0.06em 0 #fff;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    z-index: 11;
  }
  .ho-ho-ho.shown { animation: ho-ho-ho 2.6s ease-out forwards; }
  @keyframes ho-ho-ho {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25% { transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .candy-cane.wiggle { animation: none; }
    @keyframes ho-ho-ho {
      0% { opacity: 0; }
      15%, 70% { opacity: 1; }
      100% { opacity: 0; }
    }
  }
</style>

<script>
  (() => {
    const cane = document.querySelector(".candy-cane");
    const canvas = document.querySelector(".page-snow");
    const words = document.querySelector(".ho-ho-ho");
    const context = canvas.getContext("2d");
    const stillness = window.matchMedia("(prefers-reduced-motion: reduce)");

    // snow falls for this long, then the last flakes fall out
    const SNOWING_MS = 20000;
    const FLAKES = 140;
    let flakes = [];
    let stopAt = 0;
    let running = false;
    let last = 0;

    const resize = () => {
      const scale = window.devicePixelRatio || 1;
      canvas.width = innerWidth * scale;
      canvas.height = innerHeight * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);
    };

    // sizes in css px, speeds in px a second
    const newFlake = (anywhere) => ({
      x: Math.random() * innerWidth,
      y: anywhere ? Math.random() * innerHeight : -6,
      size: 1 + Math.random() * 2.5,
      fall: 30 + Math.random() * 60,
      sway: Math.random() * Math.PI * 2,
    });

    const draw = (now) => {
      const seconds = Math.min(now - last, 100) / 1000;
      last = now;
      const snowing = now < stopAt;
      context.clearRect(0, 0, innerWidth, innerHeight);
      context.fillStyle = "rgba(255, 255, 255, 0.9)";
      flakes = flakes.filter((flake) => {
        flake.y += flake.fall * seconds;
        flake.sway += seconds;
        if (flake.y > innerHeight + 6) {
          if (!snowing) return false;
          Object.assign(flake, newFlake(false));
        }
        context.beginPath();
        context.arc(flake.x + Math.sin(flake.sway) * 12, flake.y, flake.size, 0, Math.PI * 2);
        context.fill();
        return true;
      });
      if (flakes.length) {
        requestAnimationFrame(draw);
      } else {
        running = false;
        context.clearRect(0, 0, innerWidth, innerHeight);
      }
    };

    cane.addEventListener("click", () => {
      words.textContent = "Ho ho ho!";
      words.classList.remove("shown");
      cane.classList.remove("wiggle");
      // a reflow so the animations start again on every tap
      void words.offsetWidth;
      words.classList.add("shown");
      cane.classList.add("wiggle");

      if (stillness.matches) return;
      stopAt = performance.now() + SNOWING_MS;
      while (flakes.length < FLAKES) flakes.push(newFlake(flakes.length < FLAKES / 3));
      if (!running) {
        running = true;
        resize();
        last = performance.now();
        requestAnimationFrame(draw);
      }
    });

    window.addEventListener("resize", () => { if (running) resize(); });
  })();
</script>
