<form method="post" action="/config?plugin={{ plugin }}" data-autosave>
  <label>Colours
    <small>Hour / minute / second balls and rays, then the border.</small>
    <div class="field-row">
      <input type="color" name="hours_colour" value="{{ '#%02x%02x%02x' % placeholder.hours_colour }}">
      <input type="color" name="minutes_colour" value="{{ '#%02x%02x%02x' % placeholder.minutes_colour }}">
      <input type="color" name="seconds_colour" value="{{ '#%02x%02x%02x' % placeholder.seconds_colour }}">
      <input type="color" name="border_colour" value="{{ '#%02x%02x%02x' % placeholder.border_colour }}">
    </div>
  </label>

  <label>Number of balls
    <small>Hour / minute / second balls to display.</small>
    <div class="field-row">
      <input type="number" name="num_balls_hour" min="1" max="10" step="1" value="{{ placeholder.num_balls_hour }}" required>
      <input type="number" name="num_balls_minute" min="1" max="10" step="1" value="{{ placeholder.num_balls_minute }}" required>
      <input type="number" name="num_balls_second" min="1" max="10" step="1" value="{{ placeholder.num_balls_second }}" required>
    </div>
  </label>

  <label>Show border
    <small>Displays the squircle border the balls collide with.</small>
    <input type="checkbox" name="show_border" {{ "checked" if placeholder.show_border else "" }}>
  </label>
</form>
