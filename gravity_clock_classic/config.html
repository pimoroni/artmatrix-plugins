<form method="post" action="/config?plugin={{ plugin }}">
  <label>Region
    <small>Sets which daylight saving rules the clock follows.</small>
    <select name="region">
      <option value="us" {{ "selected" if placeholder.region == "us" else "" }}>us</option>
      <option value="cuba" {{ "selected" if placeholder.region == "cuba" else "" }}>cuba</option>
      <option value="eu" {{ "selected" if placeholder.region == "eu" else "" }}>eu</option>
      <option value="moldova" {{ "selected" if placeholder.region == "moldova" else "" }}>moldova</option>
      <option value="lebanon" {{ "selected" if placeholder.region == "lebanon" else "" }}>lebanon</option>
      <option value="egypt" {{ "selected" if placeholder.region == "egypt" else "" }}>egypt</option>
      <option value="chile" {{ "selected" if placeholder.region == "chile" else "" }}>chile</option>
      <option value="australia" {{ "selected" if placeholder.region == "australia" else "" }}>australia</option>
      <option value="nz" {{ "selected" if placeholder.region == "nz" else "" }}>nz</option>
    </select>
  </label>

  <label>Timezone
    <small>Your timezone.</small>
    <select name="tz_offset">
      <option value="-12" {{ "selected" if placeholder.tz_offset == -12 else "" }}>GMT-12 (Baker Island, Howland Island)</option>
      <option value="-11" {{ "selected" if placeholder.tz_offset == -11 else "" }}>GMT-11 (American Samoa, Niue, Midway)</option>
      <option value="-10" {{ "selected" if placeholder.tz_offset == -10 else "" }}>GMT-10 (Hawaii, Tahiti, Cook Islands)</option>
      <option value="-9" {{ "selected" if placeholder.tz_offset == -9 else "" }}>GMT-9 (Alaska, Gambier Islands)</option>
      <option value="-8" {{ "selected" if placeholder.tz_offset == -8 else "" }}>GMT-8 (US/Canada Pacific, Baja California)</option>
      <option value="-7" {{ "selected" if placeholder.tz_offset == -7 else "" }}>GMT-7 (US/Canada Mountain, Arizona, Sonora)</option>
      <option value="-6" {{ "selected" if placeholder.tz_offset == -6 else "" }}>GMT-6 (US/Canada Central, Mexico City, Costa Rica)</option>
      <option value="-5" {{ "selected" if placeholder.tz_offset == -5 else "" }}>GMT-5 (US/Canada Eastern, Colombia, Peru)</option>
      <option value="-4" {{ "selected" if placeholder.tz_offset == -4 else "" }}>GMT-4 (Atlantic Canada, Chile, Venezuela, Bolivia)</option>
      <option value="-3" {{ "selected" if placeholder.tz_offset == -3 else "" }}>GMT-3 (Argentina, Uruguay, E. Brazil, French Guiana)</option>
      <option value="-2" {{ "selected" if placeholder.tz_offset == -2 else "" }}>GMT-2 (Fernando de Noronha, South Georgia)</option>
      <option value="-1" {{ "selected" if placeholder.tz_offset == -1 else "" }}>GMT-1 (Azores, Cape Verde)</option>
      <option value="0" {{ "selected" if placeholder.tz_offset == 0 else "" }}>GMT+0 (UK, Ireland, Portugal, Iceland)</option>
      <option value="1" {{ "selected" if placeholder.tz_offset == 1 else "" }}>GMT+1 (Central Europe, W. Africa, Nigeria)</option>
      <option value="2" {{ "selected" if placeholder.tz_offset == 2 else "" }}>GMT+2 (Eastern Europe, Egypt, South Africa)</option>
      <option value="3" {{ "selected" if placeholder.tz_offset == 3 else "" }}>GMT+3 (Moscow, Turkey, Saudi Arabia, E. Africa)</option>
      <option value="4" {{ "selected" if placeholder.tz_offset == 4 else "" }}>GMT+4 (UAE, Oman, Azerbaijan, Georgia)</option>
      <option value="5" {{ "selected" if placeholder.tz_offset == 5 else "" }}>GMT+5 (Pakistan, Kazakhstan, Uzbekistan, Maldives)</option>
      <option value="6" {{ "selected" if placeholder.tz_offset == 6 else "" }}>GMT+6 (Bangladesh, Bhutan, Kyrgyzstan)</option>
      <option value="7" {{ "selected" if placeholder.tz_offset == 7 else "" }}>GMT+7 (Thailand, Vietnam, Indonesia W., Cambodia)</option>
      <option value="8" {{ "selected" if placeholder.tz_offset == 8 else "" }}>GMT+8 (China, W. Australia, Singapore, Philippines)</option>
      <option value="9" {{ "selected" if placeholder.tz_offset == 9 else "" }}>GMT+9 (Japan, Korea, Indonesia E.)</option>
      <option value="10" {{ "selected" if placeholder.tz_offset == 10 else "" }}>GMT+10 (E. Australia, Guam, Papua New Guinea)</option>
      <option value="11" {{ "selected" if placeholder.tz_offset == 11 else "" }}>GMT+11 (Solomon Islands, New Caledonia, Vanuatu)</option>
      <option value="12" {{ "selected" if placeholder.tz_offset == 12 else "" }}>GMT+12 (New Zealand, Fiji, Kiribati)</option>
    </select>
  </label>

  <label>Colours
    <small>Hour / minute / second, for the balls and their hands.</small>
    <div class="field-row">
      <input type="color" name="hours_colour" value="{{ '#%02x%02x%02x' % placeholder.hours_colour }}">
      <input type="color" name="minutes_colour" value="{{ '#%02x%02x%02x' % placeholder.minutes_colour }}">
      <input type="color" name="seconds_colour" value="{{ '#%02x%02x%02x' % placeholder.seconds_colour }}">
    </div>
  </label>

  <label>Number of balls
    <small>Hour / minute / second balls to display.</small>
    <div class="field-row">
      <input type="number" name="num_balls_hour" min="1" max="10" step="1" value="{{ placeholder.num_balls_hour }}">
      <input type="number" name="num_balls_minute" min="1" max="10" step="1" value="{{ placeholder.num_balls_minute }}">
      <input type="number" name="num_balls_second" min="1" max="10" step="1" value="{{ placeholder.num_balls_second }}">
    </div>
  </label>

  <button type="submit">Apply</button>
</form>
