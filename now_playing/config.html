<h3>Spotify account</h3>
<div class="account_status">
  <p class="{{ "badge connected" if placeholder.Token.last_update else ("" if placeholder.authenticated else "badge disconnected") }}">{{ "Connected" if placeholder.Token.last_update else ("Connecting..." if placeholder.authenticated else "Not connected") }}</p>
  <button type="button" class="secondary" onclick="this.hidden = true; document.querySelector('#setup').hidden = false" {{ "" if placeholder.authenticated else "hidden" }}>Reconnect</button>
</div>

<div id="setup" {{ "hidden" if placeholder.authenticated else "" }}>

  <p>1. In your Spotify developer app, add <code>http://127.0.0.1:8888/callback</code> as a Redirect URI.</p>

  <label>2. Client ID
    <small>From your Spotify developer app</small>
    <input type="text" id="client_id" value="{{ placeholder.Settings.client_id }}">
  </label>
  <button type="button" onclick="startAuth()">Connect to Spotify</button>

  <label>3. Paste the redirect URL
    <small>After you agree, Spotify opens a page that won't load. Copy its full URL from the address bar and paste it here</small>
    <input type="text" id="redirect_response" oninput="exchange()">
  </label>

  <p id="auth_error" class="hidden"></p>
</div>

<form method="post" action="/config?plugin={{ plugin }}" id="token_form">
  <input type="hidden" name="access_token" id="access_token">
  <input type="hidden" name="refresh_token" id="refresh_token">
  <input type="hidden" name="client_id" id="token_client_id">
</form>

<hr>

<h3>Display</h3>
<form method="post" action="/config?plugin={{ plugin }}">
  <label>Show paused screen
    <small>Blurs the cover and shows "Stopped/Paused" while playback is paused. Unchecked, the album art stays as it is.</small>
    <input type="checkbox" name="show_pause_screen" {{ "checked" if placeholder.Settings.show_pause_screen else "" }}>
  </label>

  <label>Show scrolling track title
    <input type="checkbox" name="show_track_title" {{ "checked" if placeholder.Settings.show_title else "" }}>
  </label>

  <fieldset>
    <legend>Scroll speed</legend>
    <div class="presets">
      <label><input type="radio" name="scroll_speed" value="30" {{ "checked" if placeholder.Settings.scroll_speed == 30 else "" }}>Slow</label>
      <label><input type="radio" name="scroll_speed" value="50" {{ "checked" if placeholder.Settings.scroll_speed == 50 else "" }}>Medium</label>
      <label><input type="radio" name="scroll_speed" value="80" {{ "checked" if placeholder.Settings.scroll_speed == 80 else "" }}>Fast</label>
    </div>
  </fieldset>

  <label>Album art directory
    <small>Where downloaded covers are stored</small>
    <input type="text" name="album_art_dir" value="{{ placeholder.Settings.album_art_dir }}">
  </label>

  <button type="submit">Apply</button>
</form>

<style>
  .hidden { display: none; }
  .account_status { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
  .account_status > * { margin: 0; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0.5rem 0.875rem; border: 1px solid var(--badge); border-radius: var(--radius); font-weight: 500; line-height: 1.2; gap: 0.375rem; }
  .badge::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--badge); }
  .badge, .badge + button { min-width: 8rem; }
  .connected { --badge: #4cc38a; }
  .disconnected { --badge: #e5484d; }
</style>

<script type="text/javascript">
  const SCOPE = "user-read-currently-playing";
  const REDIRECT_URI = "http://127.0.0.1:8888/callback";   // must match your Spotify app exactly
  let codeVerifier = null;

  const clientId = () => document.querySelector("#client_id").value.trim();

  const randomString = (length) => {
    const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const values = crypto.getRandomValues(new Uint8Array(length));
    return values.reduce((acc, x) => acc + possible[x % possible.length], "");
  };

  const sha256 = (ascii) => {
    const rightRotate = (v, a) => (v >>> a) | (v << (32 - a));
    const maxWord = Math.pow(2, 32);
    const words = [];
    const asciiBitLength = ascii.length * 8;
    let hash = [], k = [], primeCounter = 0;
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (let i = 0; i < ascii.length; i++) {
      const j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;

    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16);
      const oldHash = hash.slice(0, 8);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const temp1 = (hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6]))
          + k[i]
          + (w[i] = i < 16 ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0)) | 0;
        const temp2 = ((rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]))) | 0;
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }

    const bytes = [];
    for (let i = 0; i < 8; i++)
      for (let j = 3; j >= 0; j--) bytes.push((hash[i] >> (j * 8)) & 255);
    return new Uint8Array(bytes);
  };

  const base64url = (buffer) =>
    btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");

  let exchanging = false;

  const showError = (message) => {
    const error = document.querySelector("#auth_error");
    error.textContent = message;
    error.classList.remove("hidden");
  };

  function startAuth() {
    const id = clientId();
    if (!id) { showError("Enter your Client ID first."); return; }
    document.querySelector("#auth_error").classList.add("hidden");
    codeVerifier = randomString(64);
    const challenge = base64url(sha256(codeVerifier));
    const p = new URLSearchParams({
      response_type: "code",
      code_challenge_method: "S256",
      scope: SCOPE,
      client_id: id,
      redirect_uri: REDIRECT_URI,
      code_challenge: challenge,
    });
    window.open("https://accounts.spotify.com/authorize?" + p.toString(), "_blank");
  }

  async function exchange() {
    const pasted = document.querySelector("#redirect_response").value.trim();
    let code = null;
    try { code = new URL(pasted).searchParams.get("code"); } catch (e) {}
    if (!code) {
      if (pasted) showError("Couldn't find a code in that URL, copy the whole address and try again.");
      return;
    }
    if (!codeVerifier) { showError("The page was reloaded since you connected, click Connect to Spotify again."); return; }
    if (exchanging) return;
    exchanging = true;

    let token;
    try {
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: clientId(),
          grant_type: "authorization_code",
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });
      token = await res.json();
    } catch (e) {
      token = { error_description: "Couldn't reach Spotify, check your connection and try again." };
    }
    exchanging = false;

    if (!token.access_token || !token.refresh_token) {
      showError(token.error_description || "Spotify didn't return a token, click Connect to Spotify and try again.");
      return;
    }
    document.querySelector("#access_token").value = token.access_token;
    document.querySelector("#refresh_token").value = token.refresh_token;
    document.querySelector("#token_client_id").value = clientId();
    document.querySelector("#token_form").submit();
  }
</script>
