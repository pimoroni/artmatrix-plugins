<form method="post" action="/config?plugin={{ plugin }}">
  <fieldset>
    <legend>Kritters</legend>
    <div class="presets">
      <label><input type="radio" name="num_kritters" value="1" {{ "checked" if placeholder.num_kritters == 1 else "" }}>1</label>
      <label><input type="radio" name="num_kritters" value="3" {{ "checked" if placeholder.num_kritters == 3 else "" }}>3</label>
      <label><input type="radio" name="num_kritters" value="5" {{ "checked" if placeholder.num_kritters == 5 else "" }}>5</label>
      <label><input type="radio" name="num_kritters" value="10" {{ "checked" if placeholder.num_kritters == 10 else "" }}>10</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Planets</legend>
    <div class="presets">
      <label><input type="radio" name="num_planets" value="5" {{ "checked" if placeholder.num_planets == 5 else "" }}>5</label>
      <label><input type="radio" name="num_planets" value="10" {{ "checked" if placeholder.num_planets == 10 else "" }}>10</label>
      <label><input type="radio" name="num_planets" value="15" {{ "checked" if placeholder.num_planets == 15 else "" }}>15</label>
    </div>
  </fieldset>

  <button type="submit">Apply</button>
</form>
